quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
auth.token.secret=${AUTH_TOKEN_SECRET:}
%dev.auth.token.secret=HU01-dev-only-secret-not-for-production
%test.auth.token.secret=HU01-test-only-secret-not-for-production
smallrye.jwt.sign.key-algorithm=HS256
auth.password.memory-kib=19456
auth.password.iterations=2
auth.password.parallelism=1
